name: klt signoff

# This block's T1 tier state is graded, not hand-read: re-render the
# tier-verdict report from the committed block manifest
# (manifests/sky130-droop-detector.json) and byte-compare the fresh output
# against the committed verdict of record
# (manifests/sky130-droop-detector.signoff.json). Whoever changes the
# manifest or the cited evidence regenerates the record in the same PR, so
# the change lands in the diff for a reviewer to see.
#
# The klayout-tools version is pinned in one place: .github/klt-version.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned klt
        run: pip install "klayout-tools==$(tr -d '[:space:]' < .github/klt-version)"

      - name: Validate committed JSON parses
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(manifests/*.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no manifests/*.json found"
            exit 1
          fi
          for f in "${files[@]}"; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::not valid JSON"; exit 1; }
            echo "ok: $f"
          done

      - name: Re-run klt signoff and compare against the committed record
        run: |
          set -uo pipefail
          rc=0
          klt signoff --manifest manifests/sky130-droop-detector.json \
                      --format json > "$RUNNER_TEMP/fresh-signoff.json" || rc=$?
          # Exit 0 = every T1 item met; 3 = the grader ran clean but at
          # least one item is unmet. Both are valid runs. Anything else is
          # a hard error (manifest unreadable, cited evidence malformed).
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff exited $rc (expected 0 or 3): manifest or cited evidence is broken"
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/fresh-signoff.json" manifests/sky130-droop-detector.signoff.json; then
            echo "::error::Fresh klt signoff output differs from the committed record manifests/sky130-droop-detector.signoff.json - the committed tier verdict is stale."
            echo "Regenerate and commit the record in this same PR:"
            echo "  klt signoff --manifest manifests/sky130-droop-detector.json --format json > manifests/sky130-droop-detector.signoff.json"
            echo "---- diff (fresh vs committed), pretty-printed ----"
            diff <(python3 -m json.tool "$RUNNER_TEMP/fresh-signoff.json") \
                 <(python3 -m json.tool manifests/sky130-droop-detector.signoff.json) || true
            exit 1
          fi
          echo "Committed signoff record is fresh."
          python3 -c "import json; d=json.load(open('manifests/sky130-droop-detector.signoff.json')); print('tier verdict of record:', d['tier'], '(T1 items met: %d/%d)' % (d['t1_met_count'], d['t1_item_count']))"

      # T1 item 10 (repo hygiene): re-attest from the committed inventory and
      # fail if evidence/item10.json no longer reproduces or no longer passes.
      # PDK-free checks only; nothing here installs ngspice or the PDK.
      - name: Re-attest T1 item 10 against the committed evidence
        run: |
          klt signoff --attest 10 --inventory attest/item10.json \
                      --check evidence/item10.json
