name: klt signoff

# This block's T1 tier state is graded, not hand-read: re-render the
# tier-verdict report from the committed block manifest
# (manifests/sky130-droop-detector.json) and byte-compare the fresh output
# against the committed verdict of record
# (manifests/sky130-droop-detector.signoff.json). Whoever changes the
# manifest or the cited evidence regenerates the record in the same PR, so
# the change lands in the diff for a reviewer to see.
#
# The klayout-tools version is pinned in one place: .github/klt-version.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # PDK-free guards under tests/: every tracked .py there is a
      # standalone, stdlib-only guard whose docstring says what it checks.
      # They are discovered from the index, never listed by hand, so a guard
      # added under tests/ runs here and in package.json's check:ci with no
      # per-file edit to either (it still needs a checks[] entry in
      # attest/item10.json; the inventory-coverage guard among them fails
      # until it has one). Needs only bash, git and the pinned python3.
      # Runs ahead of the klt re-attestations so a coverage failure there
      # cannot skip it. NUL-delimited, so names are passed as literal args.
      # Fail-closed: an empty guard list is an error, and every guard runs
      # before the step exits non-zero if any failed.
      - name: Run PDK-free guards under tests/
        run: |
          set -euo pipefail
          mapfile -d '' -t guards < <(git ls-files -z ':(glob)tests/**/*.py')
          [ "${#guards[@]}" -gt 0 ] || { echo "::error::no tracked tests/**/*.py guards found"; exit 1; }
          rc=0
          for f in "${guards[@]}"; do
            echo "::group::$f"
            if ! python3 -I "$f"; then rc=1; echo "::error::$f failed"; fi
            echo "::endgroup::"
          done
          exit "$rc"

      - name: Install pinned klt
        run: pip install "klayout-tools==$(tr -d '[:space:]' < .github/klt-version)"

      - name: Re-run klt signoff and compare against the committed record
        run: |
          set -uo pipefail
          for f in manifests/sky130-droop-detector.json manifests/sky130-droop-detector.signoff.json; do python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::not valid JSON"; exit 1; }; done
          rc=0
          klt signoff --manifest manifests/sky130-droop-detector.json \
                      --format json > "$RUNNER_TEMP/fresh-signoff.json" || rc=$?
          # Exit 0 = every T1 item met; 3 = the grader ran clean but at
          # least one item is unmet. Both are valid runs. Anything else is
          # a hard error (manifest unreadable, cited evidence malformed).
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff exited $rc (expected 0 or 3): manifest or cited evidence is broken"
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/fresh-signoff.json" manifests/sky130-droop-detector.signoff.json; then
            echo "::error::Fresh klt signoff output differs from the committed record manifests/sky130-droop-detector.signoff.json - the committed tier verdict is stale."
            echo "Regenerate and commit the record in this same PR:"
            echo "  klt signoff --manifest manifests/sky130-droop-detector.json --format json > manifests/sky130-droop-detector.signoff.json"
            echo "---- diff (fresh vs committed), pretty-printed ----"
            diff <(python3 -m json.tool "$RUNNER_TEMP/fresh-signoff.json") \
                 <(python3 -m json.tool manifests/sky130-droop-detector.signoff.json) || true
            exit 1
          fi
          echo "Committed signoff record is fresh."
          python3 -c "import json; d=json.load(open('manifests/sky130-droop-detector.signoff.json')); print('tier verdict of record:', d['tier'], '(T1 items met: %d/%d)' % (d['t1_met_count'], d['t1_item_count']))"

      # T1 item 10 (repo hygiene): re-attest from the committed inventory and
      # fail if evidence/item10.json no longer reproduces or no longer passes.
      # PDK-free checks only; nothing here installs ngspice or the PDK.
      - name: Re-attest T1 item 10 against the committed evidence
        run: |
          set -uo pipefail
          rc=0
          klt signoff --attest 10 --inventory attest/item10.json \
                      --check evidence/item10.json || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Committed evidence evidence/item10.json no longer reproduces (klt signoff --attest exited $rc) - a hygiene file changed without re-attesting."
            echo "Regenerate and commit the evidence in this same PR:"
            echo "  klt signoff --attest 10 --inventory attest/item10.json -o evidence/item10.json"
            echo "For this drift only evidence/item10.json needs regenerating: the committed record manifests/sky130-droop-detector.signoff.json stays fresh (measured 2026-11-16 with pinned klayout-tools $(cat .github/klt-version), issue #133)."
            exit "$rc"
          fi
          echo "Committed item-10 evidence is fresh."

      # T1 item 9 (testbenches shipped): re-attest from the committed inventory
      # and fail if evidence/item9.json no longer reproduces. PDK-free: the
      # cold start (sim/run_all.sh) needs ngspice, the pinned PDK and the
      # batch fleet, so it is declared local_only in sim/inventory.json and
      # --check skips it, carrying the committed outcome; the present checks
      # re-hash every committed bench, so bench or inventory drift still fails
      # here. Regenerating the evidence needs the full toolchain - see
      # sim/inventory.json "cold_start".
      - name: Re-attest T1 item 9 against the committed evidence
        run: |
          set -uo pipefail
          rc=0
          klt signoff --attest 9 --inventory sim/inventory.json \
                      --check evidence/item9.json || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Committed evidence evidence/item9.json no longer reproduces (klt signoff --attest exited $rc) - a testbench or the inventory changed without re-attesting."
            echo "Regenerate and commit the evidence in this same PR:"
            echo "  klt signoff --attest 9 --inventory sim/inventory.json -o evidence/item9.json"
            exit "$rc"
          fi
          echo "Committed item-9 evidence is fresh."
